# Warren hub for the team, hosted on Felix's laptop (main computer).
# Public via Tailscale Funnel: https://felix-acer.tailb3b6fa.ts.net -> 127.0.0.1:8791
# Run: ./up.sh   (first time generates .env with secrets; .env is gitignored)
services:
  warren:
    # Upstream Warren, pinned (0.7.0, matches warren-cli 0.7.0). Bump the SHA to upgrade.
    build: https://github.com/Dymyt-ry/warren.git#9452532fb6e1802541429c1f6dbdf96396346627
    restart: unless-stopped
    ports:
      - "127.0.0.1:8791:3000"   # loopback only; Funnel is the entry point
    env_file: .env
    environment:
      WARREN_DEMO: "0"
      WARREN_SEED: "0"
      WARREN_TRUST_PROXY: "1"
    volumes:
      - warren-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    # no-new-privileges breaks exec on this host (AppArmor, kernel 7.0); cap_drop ALL still applies
    pids_limit: 256
    stop_grace_period: 15s

volumes:
  warren-data:
