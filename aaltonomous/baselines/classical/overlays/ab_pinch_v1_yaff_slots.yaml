# A/B overlay: ab_pinch_v1_yaff + standalone drop slots (ab_slots).
# Modal A/B (n=20 ep): pinch_v1_yaff 67/82, slots 61/82 vs baseline 52/82.
# GPU only, never baked: docker run ... -e AALTO_OVERLAY=ab_pinch_v1_yaff_slots <image>.
name: ab_pinch_v1_yaff_slots
flags:
  grasp.close_posture: closed_tight
  hand.closed_tight: [0.0, 0.0, 1.2, -1.0, -0.6, -1.0, -0.6]
  grasp.point_in_palm: [0.0862, -0.0864, 0.0143]       # right = [0.0862, 0.0864, 0.0143]
  motion.close_hold_s: 1.2
  perception.y_affine: [-0.0326, 0.0039]
  grasp.drop_slots: true
  policy.grasp_diag_log: true                 # passive: every A/B run measures empty closes
