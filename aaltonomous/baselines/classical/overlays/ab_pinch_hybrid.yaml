# A/B overlay: hybrid pinch. Posture per pick: pinch "demo" only for a confident metric triangle, else pinch v1.
# Modal A/B (n=20 ep): pinch_v1 cube 20/25 tri 17/29; pinch_demo cube 7/25 tri 23/29. Gate: shape_id path == metric,
# label == triangle, shape confidence >= grasp.posture_by_shape_min_conf (0.5). Needs perception.classify_shape.
# v1 values = ab_pinch_v1; demo values = grasp-section defaults hand.closed_demo / grasp.point_in_palm_demo.
# GPU only, never baked: docker run ... -e AALTO_OVERLAY=ab_pinch_hybrid <image>.
name: ab_pinch_hybrid
flags:
  grasp.close_posture: closed_tight
  hand.closed_tight: [0.0, 0.0, 1.2, -1.0, -0.6, -1.0, -0.6]
  grasp.point_in_palm: [0.0862, -0.0864, 0.0143]       # right = [0.0862, 0.0864, 0.0143]
  motion.close_hold_s: 1.2
  perception.classify_shape: true
  grasp.close_posture_by_shape: true
  grasp.posture_by_shape_min_conf: 0.5
  policy.grasp_diag_log: true                 # logs [grasp_posture] label/conf/path/posture per pick
