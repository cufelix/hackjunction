# finals_r23_all (integ-all): finals_r22 + EVERY reviewed group's flags ON together (recall, cal, grasp/release, gate, chunk, counter, softgrip, bare, prism, cage, done, pregrasp, verify, robust, order, novel, bins, langzip).
# OFF on purpose: voice (not merged), depth_blob_recover, perception.area_floor_geometric, perception.partial_ok_near_hand (hurt real frames), brain.* agent (needs a llama.cpp server), perception.principal_point center (sim-only).
name: finals_r23_all
flags:
  hand.mirror_index_middle: true                # R42a  index == middle in every hand target (real DDS slot order contradicts INTERFACE.md)
  instruction.resolve: true                     # Felix #1   ON 2026-11-14: box A sort_language 54/74 vs 1/74, 0 wrong,
                                                #            gates PASS (twice; resolver v2 82f30b09, colour lookup)
  policy.fixed_mapping: {yellow: left, blue: center, red: right}   # organisers P0: real robot sort_fixed (yellow left, purple=blue center, orange=red right)
  scene.counter_z_prior: 0.15                   # prior  NO-DEPTH fallback table height (pelvis frame, m); measured plane height (apply_height) overrides
  policy.insert_guard: true                     # insert     rung 3: abstain on all objects (0 instead of -1 on the lid)
  policy.bin_lookup: resolve_bin                # round 8  ON 2026-11-14: colour-only mapping gives the same bins (tested); shape sentences need it
  perception.self_calibration.enabled: false    # Timi calib head-camera xy self-calibration
  perception.principal_point: file             # Oliver lane 3: file | center (sim renders cx,cy at centre)
  perception.y_affine: null                     # Timi 23    [a, b]: y -= a*y + b; e.g. [-0.0326, 0.0039]
  perception.classify_shape: true              # Oliver #5/#7 shape from the top face
  perception.triangle_pose: false               # Oliver #5  triangle apex yaw + robust centre
  perception.near_bin_guard: false              # Oliver #7  shape abstain next to a bin (needs classify_shape)
  perception.no_blob_shape: false               # Oliver     no top face -> no shape (never the 2D blob)
  perception.shape_diag: false                  # Oliver     passive [shape_diag] log lines
  perception.hsv_set: robust   # r22 bisect
  perception.split_blobs: true                 # real colour  split touching same-colour objects
  grasp.yaw_align: false                        # Oliver #5  yaw-aligned triangle grasp (needs shape + pose)
  grasp.yaw_phi_deg: 105                        # Oliver #5  stock 105 (param of yaw_align)
  grasp.yaw_tri_shift: true                     # Oliver #5  stock true (param of yaw_align)
  policy.time_triage: false                     # Oliver #3  skip plans that do not fit, try the next object
  policy.max_total_attempts: 18                 # safety cap: normal scene max is 5 objects * 3 varied tries = 15
  policy.max_attempts: 2                        # stock 2    tries per object
  policy.retry_pass: false                      # Oliver #3  once-per-episode retry pass (retry_extra_attempts 2)
  policy.time_margin_s: 0.0                     # Oliver #3  e.g. 1.0; 0 = off
  policy.episode_summary_log: false             # Oliver #3  one log line per episode end
  policy.retry_vary_grasp: true                # retry-vary another grasp when the object remains in the next frame
  policy.max_attempts_vary: 3                # retry-vary e.g. 3 (needs retry_vary_grasp), only with time left
  grasp.border_posture: false                   # retry-vary label None at the image border -> demo posture
  policy.verify_placement: false                # Timi #6    post-placement verification + drop slots
  policy.verify_yellow_unknown: false           # Felix #6r  yellow in-bin detection = unknown (needs verify)
  policy.max_corrections_per_episode: null      # Felix #6r  e.g. 1; set = counter picks first (needs verify)
  grasp.drop_slots: true                       # Timi 23    standalone drop slots (no verify needed)
  grasp.drop_slot_grid: true                   # bin capacity six object-separated slots for finals layouts up to 6
  grasp.drop_slot_overflow: counter             # Felix #6r  counter | stack, when the slots are used up
  policy.grasp_diag_log: true                  # passive    [grasp_diag] per pick (held yes/no)
  motion.carry_scale: 1.0                       # Felix      <= 1 only: slower lift + carry
  motion.close_hold_s: 1.2                      # Felix      stock sim profile 0.25; e.g. 0.6 / 1.2
  motion.lift_on_stall.enabled: false           # round 9    lift on finger stall (min close_hold_s, max timeout_s)
  motion.lift_on_stall.timeout_s: 1.2           # round 9    stock 1.2
  grasp.point_in_palm: [0.0862, -0.0864, 0.0143]  # pinch fix  ON 2026-11-14 = ab_pinch_v1; LEFT palm frame, right mirrored
  grasp.close_posture: closed_tight                  # pinch fix  ON = ab_pinch_v1 (Modal 60/82 vs 52/82)
  grasp.close_posture_by_shape: true           # hybrid     demo posture only for a confident metric triangle
  grasp.posture_by_shape_min_conf: 0.5          # hybrid     min shape confidence for it
  grasp.posture_apex_gate: true                # apex gate  demo also needs a real prism top (apex_conf, max angle)
  hand.closed_tight: [0.0, 0.0, 1.2, -1.0, -0.6, -1.0, -0.6]   # pinch fix  ON = ab_pinch_v1
  perception.color_gate.enabled: true          # Felix gate   A/B arm: cand_r17 + the color_gate post-filter
  perception.online_pitch_cal: table            # Timi pitch per-episode camera pitch from the counter plane
  perception.color_gate.live_bins: true        # Felix gate  footprint = live bin estimate, else nominal + 10 cm near
  perception.color_gate.fk_mask: true          # Felix gate  FK arm/hand mask (dilated 15 px)
  motion.arm_vel_cap: 0.90                       # Timi vel   rad/s cap (sim profile 0.97)
  motion.output_caps: {arm_vel: 0.85, arm_acc: 4.0, hand_vel: 1.5, hand_acc: 8.0}  # M4: every planner/policy route, including home/abort
  instruction.normalize: true                   # New H3/H4: context-safe box + ambiguous shape normalisation (existing finals flag)
  perception.hue_guard.enabled: false   # r22 bisect
  instruction.max_chars: 2000                   # r19 fuzz   cap absurd instruction length (clause boundary)
  safety.nan_guard: true                        # r19 fuzz   non-finite arm_q/hand_q -> hold last emitted action
  instruction.strict: true                      # H2: blank/error + ambiguous/multi-destination language truthily abstains, never FIXED
  policy.safety_shell: false   # r22 bisect
  bin.vote.enabled: true                         # C3/H4/H5 corrected signed, snapshot-consistent async vote pipeline
  bin.vote.signed_rim_fit: true                  # C3  preserve physical +/-x,+/-y rim displacement through drop slots
  bin.vote.async_extract: true                   # H5  copied frames compute in look worker; act() only polls/holds
  bin.vote.frame_transform_snapshot: true        # H4  tape and rim share one non-zero-pitch transform per frame
  bin.geometry_runtime: true                    # r20 R2  every bin consumer follows the voted shift
  grasp.held_detector: finger_sum               # r20     bias-corrected held; empty close aborted early
  calib.plane.apply_height: true                # r20 R9  runtime counter_z from the depth plane (real table +5..14 cm), clamp 0.20, nominal fallback
  perception.color_gate.sat_floor: true
  instruction.multilingual: true                # r22 FI/CZ + 10 languages (timi/multilang)
  grasp.release_wait_s: 0.5                     # lag R44  hold >= 0.5 s after the open command before the retreat
  grasp.release_confirm: true                   # lag R49  empty-hand check after the open; re-open once, else home + stop
  perception.color_gate.fk_dilate_px: 5   # r23 bins
  perception.color_gate.near_margin_m: 0.10    # New H2/M1  prior/disagree union through full bin.vote.max_shift_m
  policy.generation_workers: true               # H7: reset invalidates look workers immediately; stale generations never publish
  grasp.held_calibration.enabled: true           # M3: e0 from steady empty close after home/settle; invalid disables abort
  perception.sat_floor_adaptive: true   # r23 recall
  perception.topface_mode: whole_blob   # r23 recall
  perception.relook_before_done: true   # r23 recall
  calib.hand_icp_primary: true   # r23 cal
  calib.counter_after_hand: true   # r23 cal
  calib.refit_per_look: true   # r23 cal
  perception.assoc_radius_m: 0.10   # r23 grasp
  policy.retry_jitter_m: 0.004   # r23 grasp
  grasp.staggered_release: true   # r23 grasp
  grasp.staggered_release_delay_s: 0.30   # r23 grasp
  held.read_through_carry: true   # r23 grasp
  perception.aim_z_frac: 0.12   # r23 bins
  perception.color_gate.fk_silhouette: true   # r23 bins
  perception.color_gate.sat_floor_params.blue: 90   # r23 bins
  perception.gate_below_bins: true   # r23 bins
  perception.reject_log: true   # r23 bins
  perception.sim_center_principal_point: true   # r23 bins
  perception.split_by_solidity: true   # r23 bins
  perception.still_vote: true   # r23 bins
  perception.tape_value_cut: true   # r23 bins
  policy.chunk_ticks: 15   # r23 chunk
  policy.hold_ticks: 10   # r23 chunk
  calib.wide_counter_window: true   # r23 counter
  planner.bin_wall_extra_m: 0.01   # r23 counter
  grasp.soft_hand: true   # r23 softgrip
  grasp.soft_squeeze: true   # r23 softgrip
  held.soft_detector: true   # r23 softgrip
  perception.glare_reject.enabled: true   # r23 bare
  perception.reflection_reject.enabled: true   # r23 bare
  perception.local_bg.enabled: true   # r23 bare
  perception.prism_orientation: true   # r23 prism
  grasp.lying_prism: true   # r23 prism
  grasp.cage_mode: true   # r23 cage
  grasp.tri_vertex_align: true   # r23 cage
  policy.done_confirm: true   # r23 done
  perception.look_timeout_s: 5.0   # r23 done
  planner.per_target_guard: true   # r23 done
  grasp.pregrasp_relocalise: true   # r23 pregrasp
  policy.verify_landing: true   # r23 verify
  grasp.abort_lift_first: true   # r23 robust
  policy.no_objects_relook: true   # r23 robust
  perception.flood_guard: 0.6   # r23 robust
  policy.score_order: true   # r23 order
  perception.novel_objects: true   # r23 novel
  grasp.generic: true   # r23 novel
  instruction.novel_objects: true   # r23 novel
  policy.novel_obstacles: true   # r23 novel
  perception.bins_from_image: true   # r23 bins
  instruction.structured: true               # r23 langzip
