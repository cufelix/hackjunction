# A/B overlay: real-camera colour (hf_perception 2026-11-14) ON TOP OF the submission flags, so the sim check compares
# against the submission runs (r13). hsv_set robust = one HSV set covering sim + real HF frames + lab measurements;
# split_blobs = touching same-colour objects get one detection each. GPU only, never baked:
# docker run ... -e AALTO_OVERLAY=ab_realcolour <image>.
name: ab_realcolour
flags:
  instruction.resolve: true
  policy.bin_lookup: resolve_bin
  grasp.point_in_palm: [0.0862, -0.0864, 0.0143]
  grasp.close_posture: closed_tight
  hand.closed_tight: [0.0, 0.0, 1.2, -1.0, -0.6, -1.0, -0.6]
  motion.close_hold_s: 1.2
  perception.hsv_set: robust
  perception.split_blobs: true
  policy.grasp_diag_log: true                 # passive: every A/B run measures empty closes
