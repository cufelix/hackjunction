# A/B overlay: ab_pinch_v1 (Oliver FK a44dd79) + head-camera xy self-calibration (see ab_calib.yaml for the log line
# and the sign convention). GPU only, never baked: docker run ... -e AALTO_OVERLAY=ab_pinch_v1_calib <image>.
name: ab_pinch_v1_calib
flags:
  grasp.close_posture: closed_tight
  hand.closed_tight: [0.0, 0.0, 1.2, -1.0, -0.6, -1.0, -0.6]
  grasp.point_in_palm: [0.0862, -0.0864, 0.0143]       # right = [0.0862, 0.0864, 0.0143]
  motion.close_hold_s: 1.2
  policy.grasp_diag_log: true                 # passive: every A/B run measures empty closes
  perception.self_calibration.enabled: true
