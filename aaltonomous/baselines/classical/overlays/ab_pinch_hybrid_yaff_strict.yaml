# A/B overlay: ab_pinch_hybrid_yaff with an explicit posture confidence gate.
# Modal A/B (ab_pinch_hybrid, n=20 ep): label=triangle conf for true cubes 0.89-1.0 (n=6), for true triangles
# 0.31-1.0 (median 1.0, n=35), so no threshold separates them; the gate stays at 0.5 (= ab_pinch_hybrid_yaff).
# GPU only, never baked: docker run ... -e AALTO_OVERLAY=ab_pinch_hybrid_yaff_strict <image>.
name: ab_pinch_hybrid_yaff_strict
flags:
  grasp.close_posture: closed_tight
  hand.closed_tight: [0.0, 0.0, 1.2, -1.0, -0.6, -1.0, -0.6]
  grasp.point_in_palm: [0.0862, -0.0864, 0.0143]       # right = [0.0862, 0.0864, 0.0143]
  motion.close_hold_s: 1.2
  perception.classify_shape: true
  grasp.close_posture_by_shape: true
  grasp.posture_by_shape_min_conf: 0.5
  policy.grasp_diag_log: true                 # logs [grasp_posture] label/conf/path/posture per pick
  perception.y_affine: [-0.0326, 0.0039]
