# finals_r25 = finals_r24 + brain.known_task_hard_off (known task = brain fully OFF; Tim's order). SIM left-hand z fix (shift_z 0.01, = A102 ab_lh_z_p10) is already in profile_auto.sim_overrides; real stays 0.
