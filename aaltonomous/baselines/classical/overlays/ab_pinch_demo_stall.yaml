# + motion.lift_on_stall (27-dataset-mining: 704 human Dex3 grasps, close->lift median 0.90 s, lift ~0.27 s after the
# stall). close_hold_s is the minimum: kept at the stock 0.25 (with ab_pinch_demo's 1.2 = timeout it would be a no-op).
# A/B overlay: pinch "demo" posture (Oliver FK a44dd79, pinch_demo). Thumb-index 29.1 mm, jaw-midpoint grasp point.
# Our preshape is unchanged. FK lead from our preshape 0.41-0.60 rad (>> 0.15): only safe while hand_max_lead is off.
# GPU only, never baked: docker run ... -e AALTO_OVERLAY=ab_pinch_demo_stall <image>.
name: ab_pinch_demo_stall
flags:
  grasp.close_posture: closed_tight
  hand.closed_tight: [0.00, 0.92, 0.25, -0.50, -1.41, -0.49, -1.21]
  grasp.point_in_palm: [0.1094, -0.0694, 0.0142]       # right = [0.1094, 0.0694, 0.0142]
  motion.close_hold_s: 0.25                   # = stock: the MINIMUM hold; lift_on_stall holds up to timeout_s 1.2
  motion.lift_on_stall.enabled: true
  motion.lift_on_stall.timeout_s: 1.2
  policy.grasp_diag_log: true                 # passive: every A/B run measures empty closes
