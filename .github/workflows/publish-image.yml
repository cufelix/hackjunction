# Publishes the submitted policy image under this repo's package: ghcr.io/cufelix/hackjunction:<tag>.
# Copies the already built and tested image (digest-pinned), so the package is byte-identical to what was handed in.
name: publish-image
on:
  workflow_dispatch:
    inputs:
      source:
        description: source image (pin the digest)
        default: ghcr.io/dymyt-ry/pp9gi2f@sha256:0f9e0842b6e8e517d1ebba794aa832cd43572dbdeab61edf4e95fe680b818ae0
      tag:
        description: tag under ghcr.io/cufelix/hackjunction
        default: final
permissions:
  contents: read
  packages: write
jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: copy image
        run: |
          docker buildx imagetools create -t "ghcr.io/cufelix/hackjunction:${{ inputs.tag }}" "${{ inputs.source }}"
          docker buildx imagetools inspect "ghcr.io/cufelix/hackjunction:${{ inputs.tag }}"
