name: ci-probe
on:
  push:
    branches: [felix/ci]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install numpy==2.2.6 scipy==1.15.2 opencv-python-headless==4.10.0.84 PyYAML==6.0.3 msgpack==1.2.4 websockets==15.0.1 pin==3.3.1
      - name: run each test module alone
        run: |
          for f in $(find aaltonomous tools -name 'test_*.py' | sort); do
            m=$(echo "${f%.py}" | tr / .)
            rc=0; timeout 300 python -m unittest "$m" >/dev/null 2>&1 || rc=$?; echo "MODRESULT $m $rc"
          done
