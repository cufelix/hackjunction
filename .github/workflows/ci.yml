name: ci
on:
  push:
    branches: [main, felix/ci]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install (same pins as the policy image)
        run: |
          pip install numpy==2.2.6 scipy==1.15.2 opencv-python-headless==4.10.0.84 \
            PyYAML==6.0.3 msgpack==1.2.4 websockets==15.0.1 pin==3.3.1
      - name: unit tests
        run: python -m unittest discover -s aaltonomous -p 'test_*.py' -t . -v
