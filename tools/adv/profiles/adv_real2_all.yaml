# adv-real2: real_hard (colours, camera, lighting, depth) + every real2 factor at once. Worst case, report-only.
# Camera/bin errors are relative to the calibration / scene.yaml the policy uses. Pitch convention = tools/pitch_fit.py.
# Colours: BASE diffuse colours are the measured drop_2 means (orange [152,90,47], purple [60,93,131], yellow [156,159,99],
# bins [122,69,55], tape [112,52,39]) x1.2 minus the ~45/255 white veil the sim lighting adds (measured: base [60,93,131]
# renders ~[113,141,165]); so the RENDERED lit faces land near measured x1.2 with realistic saturation.
# Internal names stay red/blue/yellow (scoring + policy aliases): red renders ORANGE, blue renders PURPLE.
name: real2_all
adv:
  cam_pitch_deg: [-12.0, -2.0]
  cam_yaw_deg: [-3.0, 3.0]
  cam_xyz_cm: 2.0                            # +-2 cm on each pelvis axis
  bin_dx_cm: [0.0, 10.0]
  bin_dx_jitter_cm: 1.0                      # per-bin extra: the real bins are not placed identically
  exposure_ev: [-0.5, 0.5]
  wb_jitter: [-0.08, 0.08]
  gamma: [0.8, 1.25]
  depth_noise_mm: 3.0
  depth_hole_frac: [0.0, 0.4]
  depth_hole_blob_frac: [0.0, 0.15]          # static blobs (counter / hands) on top of the random dropout
  depth_hole_near_boost: 2.0                 # near field (< 0.5 m: hands) drops out twice as often
  render_colors:
    red:    [137, 63, 11]
    blue:   [27, 67, 112]
    yellow: [142, 146, 74]
  bin_rgb: [101, 38, 21]
  tape_rgb: [89, 17, 2]
  ensure_object: [yellow, cylinder]
  # Object spawn widened (tech lead): pelvis x 0.19-0.35 (stock 0.26-0.33), y -0.12..+0.14 (stock +-0.17). Real grasps (Felix K1, 83): x med 0.273, p10 0.211, p90 0.344.
  # Affine remap in the sim: x' = 0.27 + 2.2857*(x-0.295), y' = 0.01 + 0.7647*y (= mat region_y [0.05,0.21], checked via mat_to_pelvis).
  object_region: {x_c: 0.27, kx: 2.2857, y_c: 0.01, ky: 0.7647}
  pp_px: [325.042, 250.927]                  # real D435i principal point (calibration.yaml); Isaac renders at 319.5/239.5
  prism_lying_frac: 0.5                      # half of the triangle prisms lie on a rectangular face (organiser-confirmed)
  hand_kp: 1.5
  hand_kd: 0.2
  counter_dz_mm: [0.0, 20.0]
  table_dy_cm: 4.0
  dark_near_keep: [0.8, 0.4, 0.0]
  start_arm_jitter_rad: 0.2
  start_hand_open: true
